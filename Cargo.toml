[package]
name = "template-rust"
version = "0.1.0"
edition = "2024"
# TODO: Update these fields for your project
authors = ["Your Name <you@example.com>"]
description = "A short description of your project"
license = "Apache-2.0"
repository = "https://github.com/OWNER/REPO"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints that are too noisy — opt out explicitly
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
