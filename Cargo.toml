[package]
name = "ghst"
version = "0.1.0"
edition = "2024"
# TODO: Update these fields for your project
description = "GitHub Scoped Tokens Helper"
license = "Apache-2.0"
repository = "https://github.com/c0rner/ghst"

[dependencies]
argh = "0.1.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
open = "5.3"
sysdirs = "0.9.4"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.3.0", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints that are too noisy — opt out explicitly
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
