[package]
name = "ghst"
version = "0.1.0"
edition = "2024"
# TODO: Update these fields for your project
description = "GitHub Scoped Tokens Helper"
license = "Apache-2.0"
repository = "https://github.com/c0rner/ghst"

[dependencies]
argh = "0.1"
base64 = "0.23"
fs2 = "0.4"
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysdirs = "0.9"
tempfile = "3.27"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.3", features = ["json"] }
zeroize = { version = "1.9", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints that are too noisy — opt out explicitly
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }
