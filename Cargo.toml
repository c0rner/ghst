[package]
name = "ghst"
description = "Least-privilege, strictly scoped GitHub user access tokens for local tools and AI agents."
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
keywords = ["ai-safety", "agent", "github"]
categories = ["artificial-intelligence", "command-line-utilities", "security"]
repository = "https://github.com/c0rner/ghst"
readme = "README.md"
include = ["/src", "README.md", "LICENSE", "profiles.toml"]

[dependencies]
argh = "0.1"
base64 = "0.23"
fs2 = "0.4"
getrandom = { version = "0.4", features = ["std"] }
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysdirs = "0.9"
tempfile = "3.27"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing", "serde"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.3", features = ["json"] }
zeroize = { version = "1.9", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints that are too noisy — opt out explicitly
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }
signal-hook = "0.4"
